[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "statecraft"
version = "0.1.0"
description = "Cyber Environment Compiler + Deterministic Action Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
]

[project.scripts]
statecraft = "statecraft.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["statecraft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
